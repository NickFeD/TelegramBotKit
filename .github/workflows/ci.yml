name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  build-pack:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ContinuousIntegrationBuild: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (pinned)
        uses: actions/setup-dotnet@v5
        with:
          # ПИНУЕМ ПАТЧ, чтобы не прыгали SDK-паки (ILLink.Tasks и т.п.)
          dotnet-version: 10.0.103
          dotnet-quality: preview
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Show dotnet info
        run: |
          dotnet --info
          dotnet --list-sdks
          dotnet --list-runtimes

      - name: Restore (locked) - src only
        run: |
          set -euo pipefail
          for proj in src/*/*.csproj; do
            echo "Restoring (locked) $proj"
            dotnet restore "$proj" --locked-mode
          done

      - name: Build - src only
        run: |
          set -euo pipefail
          for proj in src/*/*.csproj; do
            echo "Building $proj"
            dotnet build "$proj" -c Release --no-restore
          done

      - name: Pack (all packages) - src only
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for proj in src/*/*.csproj; do
            echo "Packing $proj"
            dotnet pack "$proj" -c Release -o artifacts --no-build
          done

      # Если хочешь ещё и samples билдить в CI — добавь этот шаг:
      # - name: Build samples (non-locked)
      #   run: |
      #     dotnet restore samples
      #     dotnet build samples -c Release --no-restore

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: nuget-symbols
          path: artifacts/*.snupkg
          if-no-files-found: ignore

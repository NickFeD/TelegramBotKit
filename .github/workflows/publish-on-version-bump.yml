name: Publish (version bump)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ContinuousIntegrationBuild: true
      NUGET_SOURCE: https://api.nuget.org/v3/index.json

      # secrets -> env (и дальше в if используем env.*)
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      NUGET_USER: ${{ secrets.NUGET_USER }}

      # "якорный" пакет для проверки версии на nuget.org
      CHECK_PACKAGE_ID: TelegramBotKit

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Directory.Build.props
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          p = Path("Directory.Build.props")
          root = ET.parse(p).getroot()

          version = None
          for el in root.iter():
            if el.tag.endswith("Version") and (el.text or "").strip():
              version = el.text.strip()
              break

          if not version:
            raise SystemExit("ERROR: <Version> not found in Directory.Build.props")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            f.write(f"version={version}\n")
          print(f"Version: {version}")
          PY

      - name: Check if version exists on nuget.org
        id: nugetcheck
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          ID="${CHECK_PACKAGE_ID}"
          ID_LC="$(echo "$ID" | tr '[:upper:]' '[:lower:]')"
          URL="https://api.nuget.org/v3-flatcontainer/${ID_LC}/index.json"

          echo "Checking: $ID $VERSION"
          echo "URL: $URL"

          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          url = os.environ["URL"]
          version = os.environ["VERSION"]

          try:
            with urllib.request.urlopen(url, timeout=20) as r:
              data = r.read().decode("utf-8")
          except urllib.error.HTTPError as e:
            if e.code == 404:
              # пакета ещё нет на nuget.org
              open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8").write("exists=false\n")
              print("Package not found (404).")
              sys.exit(0)
            raise

          obj = json.loads(data)
          versions = set(obj.get("versions", []))
          exists = version in versions

          open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8").write(f"exists={'true' if exists else 'false'}\n")
          print("Exists:", exists)
          PY
        env:
          URL: ${{ '' }} # не используем expressions для URL
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Skip publish (already exists)
        if: steps.nugetcheck.outputs.exists == 'true'
        shell: bash
        run: |
          echo "Already published: $CHECK_PACKAGE_ID ${{ steps.ver.outputs.version }}. Skipping."
          exit 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore (locked) - src only
        shell: bash
        run: |
          set -euo pipefail
          for proj in src/*/*.csproj; do
            echo "Restoring $proj"
            dotnet restore "$proj" --locked-mode
          done

      - name: Build - src only
        shell: bash
        run: |
          set -euo pipefail
          for proj in src/*/*.csproj; do
            echo "Building $proj"
            dotnet build "$proj" -c Release --no-restore
          done

      - name: Pack - src only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for proj in src/*/*.csproj; do
            echo "Packing $proj"
            dotnet pack "$proj" -c Release -o artifacts --no-build
          done

      - name: Validate NuGet publish settings
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ] && [ -z "${NUGET_USER:-}" ]; then
            echo "Missing secrets: set NUGET_API_KEY (classic) OR NUGET_USER (trusted publishing)." >&2
            exit 1
          fi

      - name: NuGet login (Trusted Publishing / OIDC)
        if: env.NUGET_API_KEY == '' && env.NUGET_USER != ''
        uses: NuGet/login@v1
        id: nugetlogin
        with:
          user: ${{ env.NUGET_USER }}

      - name: Publish to nuget.org
        shell: bash
        env:
          OIDC_KEY: ${{ steps.nugetlogin.outputs.key }}
        run: |
          set -euo pipefail

          KEY="${NUGET_API_KEY:-}"
          if [ -z "$KEY" ]; then
            KEY="${OIDC_KEY:-}"
          fi
          if [ -z "$KEY" ]; then
            echo "NuGet API key is empty." >&2
            exit 1
          fi

          shopt -s nullglob
          for f in artifacts/*.nupkg; do
            echo "Pushing $f"
            dotnet nuget push "$f" -k "$KEY" -s "$NUGET_SOURCE" --skip-duplicate
          done
          for f in artifacts/*.snupkg; do
            echo "Pushing $f"
            dotnet nuget push "$f" -k "$KEY" -s "$NUGET_SOURCE" --skip-duplicate
          done

      # OPTIONAL: tag + GitHub release
      - name: Create tag vX.Y.Z (optional)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="v$VERSION"

          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists. Skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release (optional)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg

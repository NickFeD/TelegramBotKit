name: Publish (version bump)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: nuget-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ContinuousIntegrationBuild: true
      NUGET_SOURCE: https://api.nuget.org/v3/index.json

      # secrets -> env (и дальше в if используем env.*)
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      NUGET_USER: ${{ secrets.NUGET_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from Directory.Build.props
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          p = Path("Directory.Build.props")
          root = ET.parse(p).getroot()

          version = None
          for el in root.iter():
            if el.tag == "Version" and (el.text or "").strip():
              version = el.text.strip()
              break

          if not version:
            raise SystemExit("ERROR: <Version> not found in Directory.Build.props")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            f.write(f"version={version}\n")
          print(f"Version: {version}")
          PY

      - name: Reject existing package versions or release tags
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/release.py check-version
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists. Choose a new version." >&2
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore, build, test, build samples, pack and validate
        run: python scripts/release.py build

      - name: Recheck version uniqueness before publication
        run: python scripts/release.py check-version

      - name: Validate NuGet publish settings
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ] && [ -z "${NUGET_USER:-}" ]; then
            echo "Missing secrets: set NUGET_API_KEY (classic) OR NUGET_USER (trusted publishing)." >&2
            exit 1
          fi

      - name: NuGet login (Trusted Publishing / OIDC)
        if: env.NUGET_API_KEY == '' && env.NUGET_USER != ''
        uses: NuGet/login@v1
        id: nugetlogin
        with:
          user: ${{ env.NUGET_USER }}

      - name: Publish to nuget.org
        shell: bash
        env:
          OIDC_KEY: ${{ steps.nugetlogin.outputs.key }}
        run: |
          set -euo pipefail

          KEY="${NUGET_API_KEY:-}"
          if [ -z "$KEY" ]; then
            KEY="${OIDC_KEY:-}"
          fi
          if [ -z "$KEY" ]; then
            echo "NuGet API key is empty." >&2
            exit 1
          fi

          shopt -s nullglob
          for f in artifacts/packages/*.nupkg; do
            echo "Pushing $f"
            dotnet nuget push "$f" -k "$KEY" -s "$NUGET_SOURCE" --no-symbols
          done
          for f in artifacts/packages/*.snupkg; do
            echo "Pushing $f"
            dotnet nuget push "$f" -k "$KEY" -s "$NUGET_SOURCE"
          done

      - name: Create tag vX.Y.Z
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="v$VERSION"

          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists. Choose a new version." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/SHA256SUMS

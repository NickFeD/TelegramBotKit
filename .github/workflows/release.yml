name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # требуется для OIDC (Trusted Publishing)

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ContinuousIntegrationBuild: true

      NUGET_SOURCE: https://api.nuget.org/v3/index.json

      # ВАЖНО: секреты кладём в env, а в if используем env.*
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      NUGET_USER: ${{ secrets.NUGET_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore (locked) - src only
        run: |
          set -euo pipefail
          for proj in src/*/*.csproj; do
            echo "Restoring $proj"
            dotnet restore "$proj" --locked-mode
          done

      - name: Build - src only
        run: |
          set -euo pipefail
          for proj in src/*/*.csproj; do
            echo "Building $proj"
            dotnet build "$proj" -c Release --no-restore
          done

      - name: Pack (all packages) - src only
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for proj in src/*/*.csproj; do
            echo "Packing $proj"
            dotnet pack "$proj" -c Release -o artifacts --no-build
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Validate NuGet publish settings
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ] && [ -z "${NUGET_USER:-}" ]; then
            echo "Missing secrets: set NUGET_API_KEY (classic) OR NUGET_USER (trusted publishing)." >&2
            exit 1
          fi

      - name: NuGet login (Trusted Publishing / OIDC)
        if: env.NUGET_API_KEY == '' && env.NUGET_USER != ''
        uses: NuGet/login@v1
        id: nugetlogin
        with:
          user: ${{ env.NUGET_USER }}

      - name: Publish to nuget.org
        env:
          OIDC_KEY: ${{ steps.nugetlogin.outputs.key }}
        run: |
          set -euo pipefail

          KEY="${NUGET_API_KEY:-}"
          if [ -z "$KEY" ]; then
            KEY="${OIDC_KEY:-}"
          fi

          if [ -z "$KEY" ]; then
            echo "NuGet API key is empty (neither classic key nor OIDC key was obtained)." >&2
            exit 1
          fi

          # В bash glob лучше держать в кавычках
          dotnet nuget push "artifacts/*.nupkg" -k "$KEY" -s "$NUGET_SOURCE" --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" -k "$KEY" -s "$NUGET_SOURCE" --skip-duplicate
